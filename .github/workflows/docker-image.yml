name: Build and Push TBlog Image
on:
  push:
    branches: [master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout source
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login To Docker
      uses: docker/login-action@v3
      with:
        registry: registry.cn-hangzhou.aliyuncs.com
        username: ${{ secrets.DOCKER_IMAGESTORE_USERNAME }}
        password: ${{ secrets.DOCKER_IMAGESTORE_PASSWORD }}

    - name: Build and push image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: TBlog.Api/Dockerfile
        push: true
        tags: |
          registry.cn-hangzhou.aliyuncs.com/tblog/tblog:latest
          registry.cn-hangzhou.aliyuncs.com/tblog/tblog:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
